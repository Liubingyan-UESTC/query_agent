[project]
name = "query-agent"
version = "1.0.0.dev0"
description = "面向 Kibana/ES 的数据查询、分析与导出 Agent 系统"
requires-python = ">=3.11"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "build", "dist", "**/migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "TID",  # flake8-tidy-imports
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "A",    # flake8-builtins：禁止遮蔽内置名（如与内置 MemoryError 同名的异常类）
    "RUF",
]
ignore = [
    "ANN401", # 允许必要处使用 Any
    "RUF001", # 中文全角标点会被判为易混淆字符
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-tidy-imports]
# 禁止相对导入，保证分层依赖在 import 语句上直接可读
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["agent", "app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"scripts/**" = ["E402"]
"**/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["agent"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

# openai._extras.numpy_proxy 会把 numpy 的 pyi 拉进检查。numpy 2.x 的 stub
# 使用了 3.12 的 `type` 语句，而本项目目标版本是 3.11，解析直接失败。
[[tool.mypy.overrides]]
module = ["openai._extras.*"]
follow_imports = "skip"

# tiktoken 是可选依赖；pandas / openpyxl 未引入 stub
[[tool.mypy.overrides]]
module = ["tiktoken", "openpyxl", "pandas"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "contract: 跨实现共享的契约测试（Store / Tool / LLM）",
    "e2e: 使用 MockLLM + MockTool 的端到端链路测试",
    "integration: 需要外部依赖（Redis / ES）的集成测试",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
